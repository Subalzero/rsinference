[package]
name = "rsinference"
version = "0.1.0"
edition = "2021"
description = "A Rust inference bridge with pluggable native backends (TensorRT, ONNX Runtime, OpenVINO)"
license = "MIT"

[lib]
name = "rsinference"
path = "src/lib.rs"

[[bin]]
name = "rsinference"
path = "src/main.rs"

[dependencies]
thiserror = "2"
# Runtime symbol resolution against the C++ bridge DLL (no link-time dependency).
libloading = "0.8"

[build-dependencies]
bindgen = "0.71"
