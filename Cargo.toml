[package]
name = "infertensorrt-rs"
version = "0.1.0"
edition = "2021"
description = "A small infer bridge for TensorRT written in Rust"
license = "MIT"

[lib]
name = "infertensorrt_rs"
path = "src/lib.rs"

[[bin]]
name = "infertensorrt-rs"
path = "src/main.rs"

[dependencies]
thiserror = "2"

[build-dependencies]
bindgen = "0.71"

[features]
default = []
# Enable when the TensorRT C++ bridge is built and should be linked.
ffi = []
